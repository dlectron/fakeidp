<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>OIDC Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/static/main.css" rel="stylesheet">
    <link rel="icon" href="../static/favicon.png">
    <script src="/static/login.js"></script>
</head>

<body class="theme-body">
<div class="theme-navbar">
    <div class="theme-navbar__logo-wrap">
        <img class="theme-navbar__logo" src="/static/logo.png">
    </div>
</div>

<div class="idp-container">
    <div class="theme-panel">
        <h2 class="theme-heading">Log in to Your Account</h2>
        <p class="idp-subtle-text">{flow} &middot; {client_id}</p>
        <form method="post" action="/auth/login">
            <input type="hidden" name="redirect_uri" value="{redirect_uri}" />
            <input type="hidden" name="state" value="{state}" />
            <input type="hidden" name="nonce" value="{nonce}" />
            <input type="hidden" name="client_id" value="{client_id}">
            <input type="hidden" name="response_type" value="{response_type}" />
            <input type="hidden" name="scope" value="{scope}" />
            <input type="hidden" name="code_challenge" value="{code_challenge}" />
            <input type="hidden" name="code_challenge_method" value="{code_challenge_method}" />
            <div class="theme-form-row">
                <div class="theme-form-label">
                    <label for="sub">Subject</label>
                </div>
                <input tabinidp="1" required id="sub" name="sub" type="text" class="theme-form-input" placeholder="sub(ject) as required in JWT"  autofocus />
            </div>
            <div class="theme-form-row">
                <div class="theme-form-label">
                    <label for="name">Name</label>
                </div>
                <input tabinidp="2" required id="name" name="name" type="text" class="theme-form-input" placeholder="name" />
            </div>
            <div id="extra-claims"></div>
            <p class="idp-subtle-text idp-claim-hint">
                Extra claims are put in both tokens as typed. A value that is valid JSON keeps its
                type, so <code>true</code>, <code>1735689600</code> and <code>["a","b"]</code> are
                not strings. Overriding <code>iss</code>, <code>aud</code> or <code>exp</code> here
                wins over the defaults.
            </p>
            <button tabinidp="3" type="button" id="add-claim" class="idp-btn theme-btn--secondary" onclick="addClaim();">Add claim</button>
            <button tabinidp="4" id="submit-login" type="submit" class="idp-btn theme-btn--primary">Login</button>
        </form>
    </div>
</div>
</body>
</html>
