# Runs fakeidp with a fixed set of users on the login screen, restyled by the
# files in ./styling, and the clients in ./clients for the client credentials
# and token exchange grants.
#
#   docker compose -f examples/docker-compose.yml up --build
#
# Then point a client at http://localhost:9090/.well-known/openid-configuration.
services:
  fakeidp:
    build: ..
    ports:
      - "9090:9090"
    environment:
      FAKE_PORT: "9090"
      EXPOSED_HOST: "http://localhost:9090"
      # A folder: every *.json in it is read, in file name order. Leave USERS
      # unset (or empty) to get the manual login form instead.
      USERS: /usr/local/etc/fakeidp/users
      # custom.css, logo.<ext> and background.<ext> in this folder restyle the
      # login screen; each is optional. Leave STYLING unset for the defaults.
      STYLING: /usr/local/etc/fakeidp/styling
      # A folder like USERS. Clients not in it are allowed everything, so leave
      # CLIENTS unset unless a test needs per-client claims or refusals.
      CLIENTS: /usr/local/etc/fakeidp/clients
    volumes:
      # Mount the folder, not the file: editors replace a file on save, which
      # leaves a single-file bind mount pointing at the old one. Users are read
      # at startup, so restart the container after editing.
      - ./users:/usr/local/etc/fakeidp/users:ro
      # Read at startup as well.
      - ./clients:/usr/local/etc/fakeidp/clients:ro
      # Looked at on every page load, so edits show up without a restart.
      - ./styling:/usr/local/etc/fakeidp/styling:ro
